name: Release

# Pushing a tag uploads prebuilt binaries to GitHub Releases.
# `cargo install` has to build all of reqwest and scraper and takes minutes, so
# this is what makes `cargo binstall acrust` finish in seconds.
on:
  push:
    tags: ["v*"]

jobs:
  upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: acrust
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
