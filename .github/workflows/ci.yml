name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      # --all-features so the live tests are type-checked too. clippy only
      # builds them, so nothing here touches AtCoder.
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Without the live feature, the tests that talk to AtCoder are not built.
      - name: test
        run: cargo test
