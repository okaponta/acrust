name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      # --all-features にするのは live feature のテストにも型検査を通すため。
      # clippy はビルドするだけなので、AtCoder には一切アクセスしない。
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # live feature を付けないので、AtCoder を叩くテストはビルドもされない。
      - name: test
        run: cargo test
