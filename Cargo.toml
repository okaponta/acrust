[package]
name = "acrust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A CLI for competitive programming on AtCoder with Rust"
repository = "https://github.com/okaponta/acrust"
homepage = "https://github.com/okaponta/acrust"
license = "MIT OR Apache-2.0"
keywords = ["atcoder", "competitive-programming", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
name = "acrust"
path = "src/lib.rs"

[[bin]]
name = "acrust"
path = "src/main.rs"

# リポジトリの外（AtCoder 本体・手元の実リポジトリ）に依存するテストを切り離す feature。
#
# `#[ignore]` だと `cargo test` の結果に "ignored" として毎回並び、
# 「何か飛ばされている」と読めてしまう。feature にしておけば、
# 普段の `cargo test` ではビルドもされず、結果にも出てこない。
#
#   cargo test --features live --test network           # AtCoder を叩く
#   cargo test --features live --test acceptance_abc418 # 手元の実データと突き合わせる
[features]
live = []

[[test]]
name = "network"
required-features = ["live"]

[[test]]
name = "acceptance_abc418"
required-features = ["live"]

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.20"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
owo-colors = "4.4.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "rustls", "charset", "http2", "gzip", "form", "system-proxy"] }
rpassword = "7.5.4"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.5"
toml_edit = "0.25.13"
